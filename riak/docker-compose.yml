version: '3'
services:
  riak:
    image: basho/riak-kv:latest
    container_name: riak-node1
    ports:
      - "8087:8087"
      - "8098:8098"
    environment:
      - RIAK_HTTP_PORT=8098
      - RIAK_PROTOBUF_PORT=8087
    volumes:
      - riak_data:/var/lib/riak
volumes:
  riak_data: